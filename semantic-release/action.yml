name: 'Semantic Release Action'
description: 'Automated semantic versioning, CHANGELOG generation, and release creation based on Conventional Commits'
author: 'Yoriito'

inputs:
  token:
    description: 'GitHub Token (requires write access to repository)'
    required: true
  phase:
    description: 'Action phase: "all" (default), "prepare", or "finalize"'
    required: false
    default: 'all'
  default-branch:
    description: 'Default branch name'
    required: false
    default: 'main'
  changelog-path:
    description: 'Path to CHANGELOG file'
    required: false
    default: 'CHANGELOG.md'
  initial-development:
    description: 'Initial development mode (for 0.X.X only): breaking->minor, minor->patch, patch->patch'
    required: false
    default: 'false'
  prerelease:
    description: 'Pre-release mode (only increment pre-release number)'
    required: false
    default: 'false'
  prerelease-suffix:
    description: 'Pre-release suffix (alpha, beta, rc, etc.)'
    required: false
    default: 'alpha'
  draft:
    description: 'Create as draft release'
    required: false
    default: 'false'
  tag-prefix:
    description: 'Tag prefix'
    required: false
    default: 'v'
  # finalize phase inputs (passed from prepare phase)
  finalize-version:
    description: '[finalize] Version to release (from prepare phase)'
    required: false
    default: ''
  finalize-version-core:
    description: '[finalize] Core version without prerelease suffix'
    required: false
    default: ''
  finalize-tag-name:
    description: '[finalize] Tag name to create (from prepare phase)'
    required: false
    default: ''
  finalize-changelog:
    description: '[finalize] Changelog content (from prepare phase)'
    required: false
    default: ''
  finalize-is-prerelease:
    description: '[finalize] Whether this is a prerelease'
    required: false
    default: 'false'

outputs:
  # Common outputs
  release-created:
    description: 'Whether a release was created (or will be created)'
    value: ${{ steps.finalize.outputs.release-created || steps.analyze.outputs.needs-release }}
  needs-release:
    description: '[prepare] Whether a release is needed'
    value: ${{ steps.analyze.outputs.needs-release }}
  version:
    description: 'Full version string (e.g., 1.2.3 or 1.2.3-alpha.1)'
    value: ${{ steps.analyze.outputs.new-version || inputs.finalize-version }}
  version-core:
    description: 'Core version without prerelease suffix (e.g., 1.2.3)'
    value: ${{ steps.analyze.outputs.version-core || inputs.finalize-version-core }}
  major:
    description: 'Major version number'
    value: ${{ steps.analyze.outputs.major }}
  minor:
    description: 'Minor version number'
    value: ${{ steps.analyze.outputs.minor }}
  patch:
    description: 'Patch version number'
    value: ${{ steps.analyze.outputs.patch }}
  prerelease-number:
    description: 'Pre-release number (in pre-release mode)'
    value: ${{ steps.analyze.outputs.prerelease-number }}
  is-initial-dev:
    description: 'Whether the initial development mode is enabled'
    value: ${{ inputs.initial-development }}
  is-prerelease:
    description: 'Whether this is a pre-release'
    value: ${{ steps.analyze.outputs.is-prerelease || inputs.finalize-is-prerelease }}
  tag-name:
    description: 'Tag name (created or to be created)'
    value: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
  release-url:
    description: 'GitHub Release URL'
    value: ${{ steps.finalize.outputs.release-url }}
  changelog:
    description: 'Generated CHANGELOG content'
    value: ${{ steps.changelog.outputs.content }}
  bump-type:
    description: 'Type of version bump (major, minor, patch, prerelease)'
    value: ${{ steps.analyze.outputs.bump-type }}

runs:
  using: 'composite'
  steps:
    # ============================================================
    # SETUP PHASE: Configure git user identity, fetch git histories and tags
    # ============================================================
    # Configure git user for bot commits.
    - name: Configure Git bot user and email
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup.sh"

    # Fetch repository histories and tags needed for version detection.
    - name: Fetch git histories and tags for version analysis
      if: inputs.phase == 'all' || inputs.phase == 'prepare'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/fetch.sh"

    # ============================================================
    # PREPARE PHASE: Analyze commits, generate changelog
    # ============================================================
    # Determine semantic version bump by analyzing conventional commits
    # since the latest tag. Outputs version numbers and categories
    # (features, fixes, breaking changes, others).
    - name: Analyze commits to determine semantic version bump
      id: analyze
      if: inputs.phase == 'all' || inputs.phase == 'prepare'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        INITIAL_DEVELOPMENT: ${{ inputs.initial-development }}
        PRERELEASE_MODE: ${{ inputs.prerelease }}
        PRERELEASE_SUFFIX: ${{ inputs.prerelease-suffix }}
      run: bash "${{ github.action_path }}/scripts/analyze.sh"

    # Create CHANGELOG.md entry for the new release based on analyzed commits
    # Groups changes by type (features, fixes, breaking changes) and includes
    # commit links and author information.
    - name: Generate CHANGELOG from conventional commits
      if: (inputs.phase == 'all' || inputs.phase == 'prepare') && steps.analyze.outputs.needs-release == 'true'
      id: changelog
      shell: bash
      env:
        NEW_VERSION: ${{ steps.analyze.outputs.new-version }}
        FEATURES: ${{ steps.analyze.outputs.features }}
        FIXES: ${{ steps.analyze.outputs.fixes }}
        BREAKING: ${{ steps.analyze.outputs.breaking }}
        OTHERS: ${{ steps.analyze.outputs.others }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/changelog-generate.sh"

    # ============================================================
    # FINALIZE PHASE: Commit and push changes, create tag, create GitHub release
    # ============================================================
    # Commit and push the generated CHANGELOG to origin with a conventional
    # commit message. Skips commit if no changes were made.
    - name: Commit and push updated CHANGELOG to origin
      if: (inputs.phase == 'all' || inputs.phase == 'finalize') && steps.analyze.outputs.needs-release == 'true'
      id: commit_push
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        NEW_VERSION: ${{ steps.analyze.outputs.new-version }}
        TAG_NAME: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        NEEDS_RELEASE: ${{ steps.analyze.outputs.needs-release }}
      run: bash "${{ github.action_path }}/scripts/commit_push.sh"

    # Create and push git tag to origin for the new release version.
    - name: Create and push release tag
      if: (inputs.phase == 'all' || inputs.phase == 'finalize') && steps.analyze.outputs.needs-release == 'true'
      id: tag
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease }}
        NEEDS_RELEASE: ${{ steps.analyze.outputs.needs-release }}
        RELEASE_CREATED: ${{ steps.finalize.outputs.release-created }}
        TAG_NAME: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
        NEW_VERSION: ${{ steps.analyze.outputs.new-version }}
      run: bash "${{ github.action_path }}/scripts/tag.sh"

    # Create a GitHub release with CHANGELOG content and metadata
    # (version, release notes, prerelease status).
    - name: Create GitHub release
      if: (inputs.phase == 'all' || inputs.phase == 'finalize') && steps.analyze.outputs.needs-release == 'true'
      id: release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PHASE: ${{ inputs.phase }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease || inputs.finalize-is-prerelease }}
        DRAFT: ${{ inputs.draft }}
        NEEDS_RELEASE: ${{ steps.analyze.outputs.needs-release }}
        RELEASE_CREATED: ${{ steps.finalize.outputs.release-created }}
        NEW_VERSION: ${{ steps.analyze.outputs.new-version || inputs.finalize-version }}
        CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content || inputs.finalize-changelog }}
        TAG_NAME: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
      run: bash "${{ github.action_path }}/scripts/release.sh"
