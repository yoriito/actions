name: 'Semantic Release Action'
description: 'Automated semantic versioning, CHANGELOG generation, and release creation based on Conventional Commits'
author: 'Yoriito'

inputs:
  token:
    description: 'GitHub Token (requires write access to repository)'
    required: true
  phase:
    description: 'Action phase: "all" (default), "prepare", or "finalize"'
    required: false
    default: 'all'
  default-branch:
    description: 'Default branch name'
    required: false
    default: 'main'
  changelog-path:
    description: 'Path to CHANGELOG file'
    required: false
    default: 'CHANGELOG.md'
  initial-development:
    description: 'Initial development mode (for 0.X.X only): breaking->major, minor->patch, patch->patch'
    required: false
    default: 'false'
  prerelease:
    description: 'Pre-release mode (only increment pre-release number)'
    required: false
    default: 'false'
  prerelease-suffix:
    description: 'Pre-release suffix (alpha, beta, rc, etc.)'
    required: false
    default: 'alpha'
  draft:
    description: 'Create as draft release'
    required: false
    default: 'false'
  tag-prefix:
    description: 'Tag prefix'
    required: false
    default: 'v'
  # finalize phase inputs (passed from prepare phase)
  finalize-version:
    description: '[finalize] Version to release (from prepare phase)'
    required: false
    default: ''
  finalize-version-core:
    description: '[finalize] Core version without prerelease suffix'
    required: false
    default: ''
  finalize-tag-name:
    description: '[finalize] Tag name to create (from prepare phase)'
    required: false
    default: ''
  finalize-changelog:
    description: '[finalize] Changelog content (from prepare phase)'
    required: false
    default: ''
  finalize-is-prerelease:
    description: '[finalize] Whether this is a prerelease'
    required: false
    default: 'false'

outputs:
  # Common outputs
  release-created:
    description: 'Whether a release was created (or will be created)'
    value: ${{ steps.finalize.outputs.release-created || steps.analyze.outputs.needs-release }}
  needs-release:
    description: '[prepare] Whether a release is needed'
    value: ${{ steps.analyze.outputs.needs-release }}
  version:
    description: 'Full version string (e.g., 1.2.3 or 1.2.3-alpha.1)'
    value: ${{ steps.analyze.outputs.new-version || inputs.finalize-version }}
  version-core:
    description: 'Core version without prerelease suffix (e.g., 1.2.3)'
    value: ${{ steps.analyze.outputs.version-core || inputs.finalize-version-core }}
  major:
    description: 'Major version number'
    value: ${{ steps.analyze.outputs.major }}
  minor:
    description: 'Minor version number'
    value: ${{ steps.analyze.outputs.minor }}
  patch:
    description: 'Patch version number'
    value: ${{ steps.analyze.outputs.patch }}
  prerelease-number:
    description: 'Pre-release number (in pre-release mode)'
    value: ${{ steps.analyze.outputs.prerelease-number }}
  is-initial-dev:
    description: 'Whether the initial development mode is enabled'
    value: ${{ inputs.initial-development }}
  is-prerelease:
    description: 'Whether this is a pre-release'
    value: ${{ steps.analyze.outputs.is-prerelease || inputs.finalize-is-prerelease }}
  tag-name:
    description: 'Tag name (created or to be created)'
    value: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
  release-url:
    description: 'GitHub Release URL'
    value: ${{ steps.finalize.outputs.release-url }}
  changelog:
    description: 'Generated CHANGELOG content'
    value: ${{ steps.changelog.outputs.content }}
  bump-type:
    description: 'Type of version bump (major, minor, patch, prerelease)'
    value: ${{ steps.analyze.outputs.bump-type }}

runs:
  using: 'composite'
  steps:
    - name: Setup Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git fetch --unshallow || true
        git fetch --tags --force --all

    # ============================================================
    # PREPARE PHASE: Analyze commits, generate changelog, commit
    # ============================================================
    - name: Analyze Commits and Determine Version
      id: analyze
      if: inputs.phase == 'all' || inputs.phase == 'prepare'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        INITIAL_DEVELOPMENT: ${{ inputs.initial-development }}
        PRERELEASE_MODE: ${{ inputs.prerelease }}
        PRERELEASE_SUFFIX: ${{ inputs.prerelease-suffix }}
      run: |
        # Get the latest semver tag (including prerelease tags)
        LATEST_TAG=$(git tag --merged HEAD --sort=-version:refname \
          | grep -E "^${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z][a-zA-Z0-9]*(\.[0-9]+)?)?$" \
          | head -1 || echo "")

        echo "Latest tag: $LATEST_TAG"

        FIRST_RELEASE=false
        
        if [ -z "$LATEST_TAG" ]; then
          echo "This is the first release"
          CURRENT_MAJOR=0
          CURRENT_MINOR=1
          CURRENT_PATCH=0
          CURRENT_PRERELEASE=""
          CURRENT_PRERELEASE_NUM=0
          COMMITS_SINCE=""
          FIRST_RELEASE=true
        else
          # Parse version from tag
          VERSION_STRING="${LATEST_TAG#$TAG_PREFIX}"
          
          # Separate prerelease part
          # Supported formats: 1.2.3, 1.2.3-alpha, 1.2.3-alpha.1
          if [[ "$VERSION_STRING" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([a-zA-Z]+)(\.([0-9]+))?)?$ ]]; then
            CURRENT_MAJOR="${BASH_REMATCH[1]}"
            CURRENT_MINOR="${BASH_REMATCH[2]}"
            CURRENT_PATCH="${BASH_REMATCH[3]}"
            CURRENT_PRERELEASE="${BASH_REMATCH[5]:-}"
            CURRENT_PRERELEASE_NUM="${BASH_REMATCH[7]:-0}"
            
            # Handle prerelease suffix without number (e.g., 1.2.3-alpha)
            if [ -n "$CURRENT_PRERELEASE" ] && [ "$CURRENT_PRERELEASE_NUM" = "0" ] && [ -z "${BASH_REMATCH[7]}" ]; then
              CURRENT_PRERELEASE_NUM=0
            fi
          else
            echo "Warning: Could not parse version from tag: $VERSION_STRING"
            CURRENT_MAJOR=0
            CURRENT_MINOR=1
            CURRENT_PATCH=0
            CURRENT_PRERELEASE=""
            CURRENT_PRERELEASE_NUM=0
          fi
          
          COMMITS_SINCE="${LATEST_TAG}..HEAD"
        fi

        echo "Current version: ${CURRENT_MAJOR}.${CURRENT_MINOR}.${CURRENT_PATCH}"
        [ -n "$CURRENT_PRERELEASE" ] && echo "Current prerelease: ${CURRENT_PRERELEASE}.${CURRENT_PRERELEASE_NUM}"

        # Detect prerelease -> stable promotion (no commits required)
        NEED_FORCE_RELEASE=false
        if [ "$PRERELEASE_MODE" = "false" ] && [ -n "$CURRENT_PRERELEASE" ]; then
          echo "Promoting prerelease ${LATEST_TAG} to stable ${CURRENT_MAJOR}.${CURRENT_MINOR}.${CURRENT_PATCH}"
          NEED_FORCE_RELEASE=true
        fi

        # Analyze commit log
        MAJOR_BUMP=false
        MINOR_BUMP=false
        PATCH_BUMP=false

        FEATURES=""
        FIXES=""
        BREAKING=""
        OTHERS=""

        # Pre-fetch all commit bodies in one pass to avoid per-commit git calls
        # Store commit bodies to a hash array with using a commit hash as a key
        declare -A COMMIT_BODIES
        _current_hash=""
        while IFS= read -r _line; do
          if [[ "$_line" =~ ^BODYHASH:([0-9a-f]+)$ ]]; then
            _current_hash="${BASH_REMATCH[1]}"
            COMMIT_BODIES["$_current_hash"]=""
          elif [ -n "$_current_hash" ]; then
            COMMIT_BODIES["$_current_hash"]+="${_line}"$'\n'
          fi
        done < <(git log $COMMITS_SINCE --no-merges --format="BODYHASH:%H%n%b" 2>/dev/null || true)

        # Use \x01 (instead of |) as field separator to avoid collisions with commit message content
        COMMIT_LOG=$(git log $COMMITS_SINCE --no-merges --pretty=format:"%s%x01%H" 2>/dev/null || echo "")

        echo "=== Commits to analyze ==="
        echo "$COMMIT_LOG"
        echo "==========================="
        
        # Exit if no commits
        if [ -z "$COMMIT_LOG" ]; then
          if [ "$NEED_FORCE_RELEASE" = "true" ]; then
            echo "No new commits, but promoting prerelease to stable"
          else
            echo "No commits found that require a release"
            echo "needs-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

        # Use `\x01` as a separator for corner case that | is used in a commit message
        while IFS=$'\x01' read -r message hash; do
          [ -z "$message" ] && continue
          
          # Detect BREAKING CHANGE (feat!:, fix!:, BREAKING CHANGE)
          echo "Checking: [$message]"
          if echo "$message" | grep -qE "^[a-z]+(\(.+\))?!:" || echo "$message" | grep -qE "^BREAKING CHANGE(\(.+\))?!?:"; then
            echo "  -> BREAKING CHANGE detected"
            MAJOR_BUMP=true
            BREAKING="${BREAKING}- ${message} (${hash})\n"
            continue
          fi

          # Detect BREAKING CHANGE in footer/body using pre-fetched commits
          if printf '%s' "${COMMIT_BODIES[$hash]}" | grep -qE "^BREAKING CHANGE(:|$)"; then
            echo "  -> BREAKING CHANGE detected in footer/body"
            MAJOR_BUMP=true
            BREAKING="${BREAKING}- ${message} (${hash})\n"
            continue
          fi

          # Detect feat: -> minor
          if echo "$message" | grep -qE "^feat(\(.+\))?:"; then
            echo "  -> Minor change detected"
            MINOR_BUMP=true
            FEATURES="${FEATURES}- ${message} (${hash})\n"
          # Detect fix: -> patch
          elif echo "$message" | grep -qE "^fix(\(.+\))?:"; then
            echo "  -> Patch change detected"
            PATCH_BUMP=true
            FIXES="${FIXES}- ${message} (${hash})\n"
          # Other Conventional Commits -> patch
          elif echo "$message" | grep -qE "^(docs|style|refactor|perf|test|chore|ci|build)(\(.+\))?:"; then
            echo "  -> Patch change detected"
            PATCH_BUMP=true
            OTHERS="${OTHERS}- ${message} (${hash})\n"
          fi
        done <<< "$COMMIT_LOG"
        
        # Exit if no releasable commits found
        if [ "$MAJOR_BUMP" = false ] && [ "$MINOR_BUMP" = false ] && [ "$PATCH_BUMP" = false ]; then
          if [ "$NEED_FORCE_RELEASE" = "true" ]; then
             echo "No new commits, but promoting prerelease to stable"
          else
            echo "No Conventional Commits found that require a release"
            echo "needs-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        
        # Calculate version
        NEW_MAJOR=$CURRENT_MAJOR
        NEW_MINOR=$CURRENT_MINOR
        NEW_PATCH=$CURRENT_PATCH
        NEW_PRERELEASE_NUM=0
        
        # Determine bump type
        if [ "$MAJOR_BUMP" = true ]; then
          BUMP_TYPE="major"
        elif [ "$MINOR_BUMP" = true ]; then
          BUMP_TYPE="minor"
        else
          BUMP_TYPE="patch"
        fi

        # initial development mode
        if [ "$INITIAL_DEVELOPMENT" = "true" ] && [ "$CURRENT_MAJOR" = "0" ]; then
          echo "Initial development mode enabled"
          echo "=== Before initial-dev check ==="
          echo "INITIAL_DEVELOPMENT=$INITIAL_DEVELOPMENT"
          echo "CURRENT_MAJOR=$CURRENT_MAJOR"
          echo "BUMP_TYPE=$BUMP_TYPE"
          echo "MAJOR_BUMP=$MAJOR_BUMP, MINOR_BUMP=$MINOR_BUMP, PATCH_BUMP=$PATCH_BUMP"
          echo "================================="
          case "$BUMP_TYPE" in
            major)
              echo "Shifting major to minor"
              BUMP_TYPE="minor"
              MAJOR_BUMP=false
              MINOR_BUMP=true
              ;;
            minor | patch)
              echo "Shifting minor/patch to patch"
              BUMP_TYPE="patch"
              MAJOR_BUMP=false
              MINOR_BUMP=false
              ;;
          esac
          echo "=== After initial-dev check ==="
          echo "BUMP_TYPE=$BUMP_TYPE"
          echo "MAJOR_BUMP=$MAJOR_BUMP, MINOR_BUMP=$MINOR_BUMP, PATCH_BUMP=$PATCH_BUMP"
          echo "================================="
        else
          echo "Initial development mode not enabled or not applicable"
        fi
        
        # Pre-release mode
        if [ "$PRERELEASE_MODE" = "true" ]; then
          # If current tag has the same prerelease suffix, increment the number
          if [ "$CURRENT_PRERELEASE" = "$PRERELEASE_SUFFIX" ]; then
            NEW_PRERELEASE_NUM=$((CURRENT_PRERELEASE_NUM + 1))
          else
            # Start new prerelease series - calculate core version first
            if [ "$MAJOR_BUMP" = true ]; then
              NEW_MAJOR=$((CURRENT_MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
            elif [ "$MINOR_BUMP" = true ]; then
              NEW_MINOR=$((CURRENT_MINOR + 1))
              NEW_PATCH=0
            else
              NEW_PATCH=$((CURRENT_PATCH + 1))
            fi
            NEW_PRERELEASE_NUM=1
          fi
          
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}-${PRERELEASE_SUFFIX}.${NEW_PRERELEASE_NUM}"
          VERSION_CORE="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          IS_PRERELEASE="true"
          BUMP_TYPE="prerelease"
        else
          # Normal release mode
          # If current is prerelease, release that core version if the core version does not exist
          CURRENT_STABLE_VERSION="${TAG_PREFIX}${CURRENT_MAJOR}.${CURRENT_MINOR}.${CURRENT_PATCH}"
          if [ -n "$CURRENT_PRERELEASE" ] && ! git rev-parse "$CURRENT_STABLE_VERSION" > /dev/null 2>&1; then
            # Release from prerelease - keep the same version
            echo "promoting prerelease ${CURRENT_STABLE_VERSION} to stable"
            NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          else
            # Normal version bump
            if [ "$MAJOR_BUMP" = true ]; then
              NEW_MAJOR=$((CURRENT_MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
            elif [ "$MINOR_BUMP" = true ]; then
              NEW_MINOR=$((CURRENT_MINOR + 1))
              NEW_PATCH=0
            else
              NEW_PATCH=$((CURRENT_PATCH + 1))
            fi
            NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          fi
          VERSION_CORE="$NEW_VERSION"
          IS_PRERELEASE="false"
          NEW_PRERELEASE_NUM=0
        fi

        # if first release, version is overrided to 0.1.0
        if [ "$FIRST_RELEASE" = true ]; then
          echo "First release detected, overriding version to 0.1.0"
          NEED_RELEASE=true
          NEW_VERSION="0.1.0"
          VERSION_CORE="0.1.0"
          NEW_MAJOR=0
          NEW_MINOR=1
          NEW_PATCH=0
          IS_PRERELEASE="false"
          BUMP_TYPE="patch"
          NEW_PRERELEASE_NUM=0
        fi
        
        TAG_NAME="${TAG_PREFIX}${NEW_VERSION}"
        
        echo "New version: $NEW_VERSION (bump type: $BUMP_TYPE)"
        
        echo "needs-release=true" >> $GITHUB_OUTPUT
        echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version-core=$VERSION_CORE" >> $GITHUB_OUTPUT
        echo "major=$NEW_MAJOR" >> $GITHUB_OUTPUT
        echo "minor=$NEW_MINOR" >> $GITHUB_OUTPUT
        echo "patch=$NEW_PATCH" >> $GITHUB_OUTPUT
        echo "prerelease-number=$NEW_PRERELEASE_NUM" >> $GITHUB_OUTPUT
        echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT
        echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT
        
        # Save content for CHANGELOG
        {
          echo "features<<EOF"
          echo -e "$FEATURES"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        {
          echo "fixes<<EOF"
          echo -e "$FIXES"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        {
          echo "breaking<<EOF"
          echo -e "$BREAKING"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        {
          echo "others<<EOF"
          echo -e "$OTHERS"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Generate CHANGELOG
      if: (inputs.phase == 'all' || inputs.phase == 'prepare') && steps.analyze.outputs.needs-release == 'true'
      id: changelog
      shell: bash
      env:
        NEW_VERSION: ${{ steps.analyze.outputs.new-version }}
        FEATURES: ${{ steps.analyze.outputs.features }}
        FIXES: ${{ steps.analyze.outputs.fixes }}
        BREAKING: ${{ steps.analyze.outputs.breaking }}
        OTHERS: ${{ steps.analyze.outputs.others }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease }}
      run: |
        DATE=$(date +%Y-%m-%d)
        
        # Add label for pre-release
        if [ "$IS_PRERELEASE" = "true" ]; then
          VERSION_LABEL="${NEW_VERSION} (Pre-release)"
        else
          VERSION_LABEL="${NEW_VERSION}"
        fi
        
        # Generate new CHANGELOG entry
        CHANGELOG_ENTRY="## [${VERSION_LABEL}](../../releases/tag/${TAG_PREFIX}${NEW_VERSION}) - ${DATE}\n\n"
        
        if [ -n "$BREAKING" ]; then
          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}### ⚠ BREAKING CHANGES\n\n${BREAKING}\n"
        fi
        
        if [ -n "$FEATURES" ]; then
          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}### ✨ Features\n\n${FEATURES}\n"
        fi
        
        if [ -n "$FIXES" ]; then
          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}### 🐛 Bug Fixes\n\n${FIXES}\n"
        fi
        
        if [ -n "$OTHERS" ]; then
          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}### 🔧 Other Changes\n\n${OTHERS}\n"
        fi
        
        # Update CHANGELOG file
        if [ -f "$CHANGELOG_PATH" ]; then
          # Prepend to existing CHANGELOG
          TEMP_FILE=$(mktemp)
          echo -e "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n${CHANGELOG_ENTRY}" > "$TEMP_FILE"
          # Skip header lines and append existing content
          tail -n +4 "$CHANGELOG_PATH" >> "$TEMP_FILE" 2>/dev/null || true
          mv "$TEMP_FILE" "$CHANGELOG_PATH"
        else
          # Create new file
          echo -e "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n${CHANGELOG_ENTRY}" > "$CHANGELOG_PATH"
        fi
        
        # Save for release notes
        {
          echo "content<<EOF"
          echo -e "$CHANGELOG_ENTRY"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        echo "CHANGELOG generated at $CHANGELOG_PATH"

    - name: Commit CHANGELOG (prepare phase)
      if: (inputs.phase == 'all' || inputs.phase == 'prepare') && steps.analyze.outputs.needs-release == 'true'
      shell: bash
      env:
        NEW_VERSION: ${{ steps.analyze.outputs.new-version }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
      run: |
        git add "$CHANGELOG_PATH"
        
        if git diff --cached --quiet; then
          echo "No CHANGELOG changes to commit"
        else
          if [ "$IS_PRERELEASE" = "true" ]; then
            git commit -m "chore: release ${NEW_VERSION} (pre-release)"
          else
            git commit -m "chore: release ${NEW_VERSION}"
          fi
          echo "CHANGELOG committed"
        fi

    # ============================================================
    # FINALIZE PHASE: Tag, push, create GitHub release
    # ============================================================
    - name: Create Tag, Push, and Release
      id: finalize
      if: inputs.phase == 'all' || inputs.phase == 'finalize'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PHASE: ${{ inputs.phase }}
        # From prepare phase (phase=all) or inputs (phase=finalize)
        NEW_VERSION: ${{ steps.analyze.outputs.new-version || inputs.finalize-version }}
        VERSION_CORE: ${{ steps.analyze.outputs.version-core || inputs.finalize-version-core }}
        TAG_NAME: ${{ steps.analyze.outputs.tag-name || inputs.finalize-tag-name }}
        IS_PRERELEASE: ${{ steps.analyze.outputs.is-prerelease || inputs.finalize-is-prerelease }}
        CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content || inputs.finalize-changelog }}
        NEEDS_RELEASE: ${{ steps.analyze.outputs.needs-release }}
        DRAFT: ${{ inputs.draft }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        # Skip if prepare phase determined no release needed (phase=all only)
        if [ "$PHASE" = "all" ] && [ "$NEEDS_RELEASE" != "true" ]; then
          echo "No release needed, skipping finalize"
          echo "release-created=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Validate required inputs for finalize phase
        if [ -z "$NEW_VERSION" ] || [ -z "$TAG_NAME" ]; then
          echo "Error: Missing required inputs for finalize phase"
          echo "NEW_VERSION=$NEW_VERSION"
          echo "TAG_NAME=$TAG_NAME"
          exit 1
        fi
        
        echo "Finalizing release: $TAG_NAME"

        # If tag already exits, skip release
        if git rev-parse "$TAG_NAME" > /dev/null 2>&1; then
          echo "Warning: Tag $TAG_NAME already exists, skipping"
          echo "release-created=false" >> ${GITHUB_OUTPUT}
          exit 0
        fi
        
        # Create tag (before push, so it's included)
        git tag -a "$TAG_NAME" -m "Release ${NEW_VERSION}"
        echo "Tag created: $TAG_NAME"
        
        # Push commits and tag together
        git push origin HEAD --follow-tags
        git push --tags || true
        echo "Pushed commits and tag"
        
        # Create GitHub Release
        PRERELEASE_FLAG=""
        [ "$IS_PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"
        
        DRAFT_FLAG=""
        [ "$DRAFT" = "true" ] && DRAFT_FLAG="--draft"
        
        if [ "$IS_PRERELEASE" = "true" ]; then
          RELEASE_TITLE="Pre-release ${NEW_VERSION}"
        else
          RELEASE_TITLE="Release ${NEW_VERSION}"
        fi
        
        # Create release notes file
        NOTES_FILE=$(mktemp)
        echo -e "$CHANGELOG_CONTENT" > "$NOTES_FILE"
        
        RELEASE_URL=$(gh release create "$TAG_NAME" \
          --title "$RELEASE_TITLE" \
          --notes-file "$NOTES_FILE" \
          $PRERELEASE_FLAG \
          $DRAFT_FLAG 2>&1) || RELEASE_URL=""
        
        rm -f "$NOTES_FILE"
        
        echo "release-created=true" >> $GITHUB_OUTPUT
        
        if [ -n "$RELEASE_URL" ]; then
          echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "GitHub Release created: $RELEASE_URL"
        fi
        
        echo "Release finalized: $TAG_NAME"
