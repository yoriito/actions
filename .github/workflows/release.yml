# Release workflow for this actions repository
# Creates releases and updates major version tags (v1, v2, etc.)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initial-development:
        description: 'Create an initial release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Create a prerelease'
        required: false
        default: true
        type: boolean
      prerelease-suffix:
        description: 'Suffix for the prerelease version'
        required: false
        default: 'rc'
        type: string
      tag-prefix:
        description: 'Prefix for the release tag'
        required: false
        default: 'v'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      tag-name: ${{ steps.release.outputs.tag-name }}

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      # Use our own action to create releases
      - name: Create Release
        id: release
        uses: ./semantic-release
        with:
          token: ${{ steps.app-token.outputs.token }}
          initial-development: ${{ github.event.inputs.initial-development || vars.INITIAL_DEVELOPMENT || true }}
          prerelease: ${{ github.event.inputs.prerelease || vars.PRERELEASE || true }}
          prerelease-suffix: ${{ github.event.inputs.prerelease-suffix || vars.PRERELEASE_SUFFIX || 'rc' }}
          tag-prefix: ${{ github.event.inputs.tag-prefix || vars.TAG_PREFIX || 'v' }}

      - name: Release Summary
        if: steps.release.outputs.release-created == 'true'
        run: |
          echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.release.outputs.tag-name }}" >> $GITHUB_STEP_SUMMARY

  # Update major version tag (v1, v2, etc.) for easier referencing
  update-major-tag:
    name: Update Major Version Tag
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Update major version tag
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          MAJOR: ${{ needs.release.outputs.major }}
          TAG_NAME: ${{ needs.release.outputs.tag-name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MAJOR_TAG="v${MAJOR}"
          
          echo "Updating major version tag: $MAJOR_TAG -> $TAG_NAME"
          
          # Delete existing major tag if it exists
          git tag -d "$MAJOR_TAG" 2>/dev/null || true
          git push origin ":refs/tags/$MAJOR_TAG" 2>/dev/null || true
          
          # Create new major tag pointing to the release
          git tag "$MAJOR_TAG" "$TAG_NAME"
          git push origin "$MAJOR_TAG"
          
          echo "✓ Updated $MAJOR_TAG to point to $TAG_NAME"

      - name: Update Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Major Version Tag Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`v${{ needs.release.outputs.major }}\` now points to \`${{ needs.release.outputs.tag-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can reference this action as:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "uses: yoriito/actions/semantic-release@v${{ needs.release.outputs.major }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
