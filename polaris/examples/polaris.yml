# .github/workflows/polaris.yml
# This workflow runs Polaris Security Scan.
# Please refer polaris/examples/polaris.yml in "actions" repository in detail.

name: Polaris Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - 'security-reports/**'
  # Disable the pull_request trigger for now, since it produces unnecessary report diffs on PRs.
  # We can re-enable it later when we consider merge blocking based on the scan/report results.
  # pull_request:
  #   branches: [main]
  #   paths-ignore:
  #     - 'security-reports/**'
  workflow_dispatch: {}

env:
  POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
  REPORT_DIR: security-reports/polaris

# GitHub token permissions for post-scan actions. Required for built-in GITHUB_TOKEN; if using a PAT with equivalent scopes, permissions block can be commented out.
permissions:
  contents: write               # Required to push changes or create fix branches
  # pull-requests: write          # Required to add comments or create fix pull requests

jobs:
  polaris:
    name: Polaris
    runs-on: ubuntu-latest
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Polaris Security Scan
        uses: yoriito/actions/polaris@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          polaris_project_name: ${{ vars.POLARIS_PROJECT_NAME }}
          polaris_branch_name: ${{ github.ref_name }}
          detect_search_depth: ${{ vars.DETECT_SEARCH_DEPTH }}
