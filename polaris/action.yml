# Quickstart: Black Duck Security Scan Action with polaris:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/t_github-polaris-quickstart.html

name: Polaris Security Scan
description: 'Run Polaris SAST/SCA security scan and commit reports'
author: 'Yoriito'

inputs:
  token:
    description: 'GitHub Token (requires write access for pushing reports and PR comments)'
    required: true
  polaris_project_name:
    description: 'Polaris project name'
    required: true
  polaris_branch_name:
    description: 'Polaris branch name'
    required: true
  detect_search_depth:
    description: 'Detect search depth'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set Polaris server URL
      shell: bash
      run: echo "POLARIS_SERVER_URL=https://polaris.blackduck.com" >> "$GITHUB_ENV"   

    # ==========================================
    # Security Scan with Polaris (Currently SCA only)
    # ==========================================
    - name: Polaris Security Scan
      id: polaris-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        ### SCANNING: Required fields
        polaris_server_url: ${{ env.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ env.POLARIS_ACCESS_TOKEN }}
        ### ASSESSMENT TYPES
        # To enable SAST scanning, change "SCA" to "SAST,SCA".
        polaris_assessment_types: SCA  # Comma-separated list: SAST,SCA,DAST
        ### SCAN CONFIGURATION: Uncomment below to enable
        polaris_waitForScan: true # Wait for scan completion before proceeding

        ### SCANNING: Optional fields
        # To enable SAST scanning, uncomment the line below.
        # polaris_test_sast_location: local
        polaris_test_sca_location: hybrid
        polaris_test_sca_type: "SCA-PACKAGE, SCA-SIGNATURE"  # add on 09/14/2026 to add signature scanning
        polaris_application_name: 'Yoriito vehicle API'
        polaris_project_name: ${{inputs.polaris_project_name}}
        polaris_branch_name: ${{inputs.polaris_branch_name}}
        ### Detect: search depth for package-manager manifests
        detect_search_depth: ${{ inputs.detect_search_depth }}
        ### Configuration if Bridge diagnostic files needs to be uploaded
        include_diagnostics: true
        ### GITHUB TOKEN
        github_token: ${{ inputs.token }}

        ### Mark build status if policy violating issues are found
        # mark_build_status: failure # Set to success, failure, or skip

    # ==========================================
    # Retrieve IDs
    # ==========================================
    - name: Get Application/Project/Branch IDs
      id: get-ids
      shell: bash
      env:
        POLARIS_SERVER_URL: ${{ env.POLARIS_SERVER_URL }}
      run: |
        set -euo pipefail

        POLARIS_PROJECT_NAME="${{inputs.polaris_project_name}}"
        POLARIS_BRANCH_NAME="${{inputs.polaris_branch_name}}"
        echo "POLARIS_PROJECT_NAME=${{ inputs.polaris_project_name }}" >> "$GITHUB_ENV"

        # ==========================================
        # Portfolio ID
        # ==========================================
        echo "Getting Portfolio ID..."

        PORTFOLIO_ID=$(curl -fsS \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "accept: application/json" \
          "$POLARIS_SERVER_URL/api/portfolios" \
        | jq -r '._items[0].id')

        echo "PORTFOLIO_ID=$PORTFOLIO_ID" >> $GITHUB_ENV

        # ==========================================
        # Application ID
        # ==========================================
        echo "Getting Application ID..."

        APPLICATION_ID=$(curl -fsS \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "accept: application/json" \
          "$POLARIS_SERVER_URL/api/portfolios/$PORTFOLIO_ID/applications" \
          | jq -r '._items[0].id')

        echo "APPLICATION_ID=$APPLICATION_ID" >> $GITHUB_ENV

        # ==========================================
        # Project ID
        # ==========================================
        echo "Getting Project ID..."

        PROJECT_ID=$(curl -fsS \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "accept: application/json" \
          "$POLARIS_SERVER_URL/api/portfolios/$PORTFOLIO_ID/applications/$APPLICATION_ID/projects" \
          | jq -r --arg NAME "$POLARIS_PROJECT_NAME" '._items[] | select(.name==$NAME) | .id')

        echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

        # ==========================================
        # Branch ID
        # ==========================================
        echo "Getting Branch ID..."

        for i in {1..10}; do
          BRANCH_ID=$(curl -fsS \
            -H "Api-token: $POLARIS_ACCESS_TOKEN" \
            -H "accept: application/json" \
            "$POLARIS_SERVER_URL/api/portfolios/$PORTFOLIO_ID/applications/$APPLICATION_ID/projects/$PROJECT_ID/branches" \
            | jq -r "._items[] | select(.name==\"$POLARIS_BRANCH_NAME\") | .id")

          if [ -n "$BRANCH_ID" ]; then
            break
          fi

          echo "Waiting for branch to appear in Polaris API... ($i/10)"
          sleep 30
        done

        echo "BRANCH_ID=$BRANCH_ID" >> $GITHUB_ENV
        
        # ==========================================
        # Display the retrieved IDs
        # ==========================================
        echo "PORTFOLIO_ID=$PORTFOLIO_ID"
        echo "APPLICATION_ID=$APPLICATION_ID"
        echo "PROJECT_ID=$PROJECT_ID"
        echo "BRANCH_ID=$BRANCH_ID"

    # ==========================================
    # Generate and download Polaris reports (SAST, SCA & SBOM)
    # ==========================================
    - name: Generate and download Polaris reports (SAST, SCA & SBOM)
      id: generate-reports
      shell: bash
      env:
        POLARIS_SERVER_URL: ${{ env.POLARIS_SERVER_URL }}
      run: |
        set -euo pipefail

        # ==========================================
        # 1) Run Report for SAST (POST)
        # ==========================================
        # To enable SAST report generation, uncomment the SAST report generation block below.

        # echo "Generating SAST report..."
        # RESPONSE_SAST=$(curl -s -X 'POST' \
        #   "$POLARIS_SERVER_URL/api/insights/reports/developer-detail-Static/_actions/run" \
        #   -H "Api-token: $POLARIS_ACCESS_TOKEN" \
        #   -H "Content-Type: application/vnd.polaris.insights.reports-1+json" \
        #   -d '{
        #     "name": "SAST Report configuration",
        #     "appendDate": true,
        #     "applications": [
        #       {
        #         "id": "'"$APPLICATION_ID"'",
        #         "projects": [
        #           "'"$PROJECT_ID"'"
        #         ]
        #       }
        #     ],
        #     "severities": [
        #       "critical",
        #       "high",
        #       "medium",
        #       "low",
        #       "informational"
        #     ],
        #     "tools": [
        #       "STATIC_POLARIS"
        #     ],
        #     "standard": "ty-2"
        #   }'
        # )

        # SAST_TEST_RESPONSE=$(curl -fsS -G \
        #   -H "Api-token: $POLARIS_ACCESS_TOKEN" \
        #   -H "accept: application/vnd.polaris.tests.tests-list-1+json" \
        #   "$POLARIS_SERVER_URL/api/tests" \
        #   --data-urlencode "_filter=projectId==$PROJECT_ID and assessmentType==SAST" \
        #   --data-urlencode "_limit=1")
      
        # SAST_TEST_ID=$(echo "$SAST_TEST_RESPONSE" | jq -r '._items[0].id')
        # SAST_SHORT_ID=$(echo "$SAST_TEST_RESPONSE" | jq -r '._items[0].shortId')
        # SAST_REPORT_ID=$(echo "$RESPONSE_SAST" | jq -r '.id')
        # echo "SAST Test ID: $SAST_TEST_ID"
        # echo "SAST Short ID: $SAST_SHORT_ID"
        # echo "SAST Report ID: $SAST_REPORT_ID"

        # ==========================================
        # 2) Wait for test Completed
        # ==========================================
        # SAST is not supported.
        echo "Waiting for Completed SCA test results for branch $BRANCH_ID..."

        for i in {1..10}; do
          SCA_TEST_RESPONSE=$(curl -fsS -G \
            -H "Api-token: $POLARIS_ACCESS_TOKEN" \
            -H "accept: application/vnd.polaris.tests.tests-list-1+json" \
            "$POLARIS_SERVER_URL/api/tests" \
            --data-urlencode "_filter=projectId==$PROJECT_ID and assessmentType==SCA and branchId==$BRANCH_ID" \
            --data-urlencode "_sort=updatedDate|desc" \
            --data-urlencode "_limit=1")

          SCA_TEST_ID=$(echo "$SCA_TEST_RESPONSE" | jq -r '._items[0].id // empty')
          SCA_SHORT_ID=$(echo "$SCA_TEST_RESPONSE" | jq -r '._items[0].shortId // empty')
          SCA_STATE=$(echo "$SCA_TEST_RESPONSE" | jq -r '._items[0].state.name // empty')

          if [ "$SCA_STATE" = "Completed" ]; then
            echo "SCA test for branch is Completed (test id: $SCA_TEST_ID)."
            break
          fi

          echo "Waiting for SCA test results... state=${SCA_STATE:-none} ($i/10)"
          sleep 30
        done

        if [ "$SCA_STATE" != "Completed" ]; then
          echo "::error::SCA test for branch '$BRANCH_ID' not Completed after 10 attempts (last state: ${SCA_STATE:-none})."
          exit 1
        fi

        echo "Waiting 20 minutes for scan results to settle..."
        sleep 1200

        # ==========================================
        # 3) Run Report for SCA (POST)
        # ==========================================
        echo "Generating SCA report..."
        RESPONSE_SCA=$(curl -s -X 'POST' \
          "$POLARIS_SERVER_URL/api/insights/reports/developer-detail-sca/_actions/run" \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "Content-Type: application/vnd.polaris.insights.reports-2+json" \
          -d '{
            "scope": "SELECTED_BRANCHES",
            "filter": "id=in=('"$BRANCH_ID"')",
            "name": "SCA Report configuration",
            "appendDate": true,
            "severities": [
              "critical",
              "high",
              "medium",
              "low",
              "informational"
            ],
            "tools": [
              "SCA_PACKAGE",
              "SCA_SIGNATURE"
            ],
            "standard": "ty-2"
          }'
        )

        SCA_REPORT_ID=$(echo "$RESPONSE_SCA" | jq -r '.id')
        echo "SCA Test ID: $SCA_TEST_ID"
        echo "SCA Short ID: $SCA_SHORT_ID"
        echo "SCA report ID: $SCA_REPORT_ID"

        # ==========================================
        # 4) Run Report for SBOM in SPDX format (POST)
        # ==========================================
        echo "Generating SBOM..."
        RESPONSE_SBOM=$(curl -s -X 'POST'\
          "$POLARIS_SERVER_URL/api/insights/reports/spdx/_actions/run" \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "Content-Type: application/vnd.polaris.insights.reports-1+json" \
          -d '{
            "name": "SBOM SPDX configuration",
            "appendDate": true,
            "applications": [
              {
                "id": "'"$APPLICATION_ID"'",
                "projects": [
                  "'"$PROJECT_ID"'"
                ]
              }
            ]
          }'
        )

        SBOM_REPORT_ID=$(echo "$RESPONSE_SBOM" | jq -r '.id')
        echo "SBOM Report ID: $SBOM_REPORT_ID"

        # ==========================================
        # 5) Wait for reports to complete (Polling function)
        # ==========================================
        wait_for_report() {
          local report_id=$1
          local name=$2
          local status="RUNNING"

          echo "Waiting for $name report ($report_id) to complete..."
          for i in {1..20}; do
            status_resp=$(curl -s -X 'GET' \
              "$POLARIS_SERVER_URL/api/insights/reports/$report_id" \
              -H "Api-token: $POLARIS_ACCESS_TOKEN" \
              -H "Accept: application/vnd.polaris.insights.reports-2+json")

            status=$(echo "$status_resp" | jq -r '.status')
            echo "  -> $name status: $status (Attempt $i/20)"

            if [ "$status" = "COMPLETED" ]; then
              echo "$name report is ready."
              return 0
            elif [ "$status" = "FAILED" ]; then
              echo "$name report generation failed."
              echo "$status_resp"
              return 1
            fi
            sleep 30
          done
          echo "$name report generation timed out."
          return 1
        }

        # Call the wait_for_report function for each report
        # To enable SAST report generation, uncomment the line below.
        # wait_for_report "$SAST_REPORT_ID" "SAST"
        wait_for_report "$SCA_REPORT_ID" "SCA"
        wait_for_report "$SBOM_REPORT_ID" "SBOM(SPDX)"

        # ==========================================
        # 6) Download reports (SAST and SCA reports as PDF, SBOM as JSON)
        # ==========================================

        mkdir -p "$REPORT_DIR"
        rm -f "$REPORT_DIR"/*
        # To download SAST reports, uncomment the line below.
        # SAST_FILE="$REPORT_DIR/SAST.pdf"
        SCA_FILE="$REPORT_DIR/SCA.pdf"
        SBOM_FILE="$REPORT_DIR/SBOM.json"

        # To download SAST reports, uncomment the block below.
        # echo "Downloading SAST report (PDF) to $SAST_FILE..."
        # curl -s -X 'GET' \
        #   "$POLARIS_SERVER_URL/api/insights/reports/$SAST_REPORT_ID/_actions/download" \
        #   -H "Api-token: $POLARIS_ACCESS_TOKEN" \
        #   -H "Accept: */*" \
        #   -o "$SAST_FILE"

        echo "Downloading SCA report (PDF) to $SCA_FILE..."
        curl -s -X 'GET' \
          "$POLARIS_SERVER_URL/api/insights/reports/$SCA_REPORT_ID/_actions/download" \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "Accept: */*" \
          -o "$SCA_FILE"

        echo "Downloading SBOM (SPDX) report (JSON) to $SBOM_FILE..."
        curl -s -X 'GET' \
          "$POLARIS_SERVER_URL/api/insights/reports/$SBOM_REPORT_ID/_actions/download" \
          -H "Api-token: $POLARIS_ACCESS_TOKEN" \
          -H "Accept: */*" \
          -o "$SBOM_FILE"

        # ==========================================
        # 7) Warn when SBOM has no dependency packages
        # ==========================================
        # Empty SBOM: expected or missed detect.
        pkg_count=$(jq '.packages | length' "$SBOM_FILE")
        if [ "$pkg_count" -le 1 ]; then
          echo "::warning title=Empty SBOM::Only ${pkg_count} package(s); check DETECT_SEARCH_DEPTH."
        else
          echo "SBOM package count: ${pkg_count}"
        fi

    # ==========================================
    # Commit and Push to Git
    # ==========================================
    - name: Commit & push Polaris reports
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: upload Polaris reports [skip ci]"
        branch: ${{ github.head_ref || github.ref_name }}
        file_pattern: ${{ env.REPORT_DIR }}/**
