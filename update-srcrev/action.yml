name: 'Yocto Recipe Update Action'
description: 'Update SRCREV in Yocto/OpenEmbedded recipe files to the latest revision'
author: 'Yoriito'

inputs:
  recipe-paths:
    description: 'Recipe file paths (space-separated or newline-separated)'
    required: true
  token:
    description: 'GitHub Token (for private repositories)'
    required: false
    default: ''

outputs:
  updated:
    description: 'Whether any recipes were updated ("true" or "false")'
    value: ${{ steps.update.outputs.updated }}
  changes:
    description: 'JSON array of changes'
    value: ${{ steps.update.outputs.changes }}
  summary:
    description: 'Human-readable summary of changes'
    value: ${{ steps.update.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Setup Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Update Recipes
      id: update
      shell: bash
      env:
        RECIPE_PATHS: ${{ inputs.recipe-paths }}
        GIT_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Initialize
        CHANGES_JSON="[]"
        COMMIT_BODY=""
        UPDATED="false"
        UPDATED_FILES=""

        # Parse recipe paths (handle both space and newline separated)
        RECIPES=$(echo "$RECIPE_PATHS" | tr '\n' ' ' | tr -s ' ')

        for RECIPE in $RECIPES; do
          echo "=========================================="
          echo "Processing: $RECIPE"
          echo "=========================================="

          if [ ! -f "$RECIPE" ]; then
            echo "Warning: Recipe file not found: $RECIPE"
            continue
          fi

          RECIPE_NAME=$(basename "${RECIPE%.*}")

          # Read the entire file content
          RECIPE_CONTENT=$(cat "$RECIPE")

          # Extract SRC_URI with continuation lines
          # This handles:
          #   SRC_URI = "..."
          #   SRC_URI = "... \
          #              ..."
          #   SRC_URI += "..."
          SRC_URI_BLOCK=$(echo "$RECIPE_CONTENT" | awk '
            /^SRC_URI[[:space:]]*[+=]/ {
              printing = 1
            }
            printing {
              line = line " " $0
              if (!/\\[[:space:]]*$/) {
                printing = 0
              }
            }
            END {
              gsub(/\\/, "", line)
              gsub(/"/, "", line)
              gsub(/SRC_URI[[:space:]]*\+?=[[:space:]]*/, "", line)
              gsub(/^[[:space:]]*=[[:space:]]*/, "", line)
              gsub(/[[:space:]]+/, " ", line)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
              print line
            }
          ')

          echo "SRC_URI entries: $SRC_URI_BLOCK"

          # Extract git:// entries
          for ENTRY in $SRC_URI_BLOCK; do
            # Skip non-git entries
            if ! echo "$ENTRY" | grep -qE "^git://|^gitsm://"; then
              continue
            fi

            echo ""
            echo "--- Git entry: $ENTRY ---"

            # Parse URI components
            # Format: git://host/path;param1=val1;param2=val2
            BASE_URI=$(echo "$ENTRY" | sed 's/;.*//')
            PARAMS=$(echo "$ENTRY" | grep -oE ';[^;]+' | tr -d ';' || echo "")

            # Extract parameters
            BRANCH=""
            NAME=""
            PROTOCOL=""

            for PARAM in $PARAMS; do
              KEY=$(echo "$PARAM" | cut -d'=' -f1)
              VALUE=$(echo "$PARAM" | cut -d'=' -f2-)
              case "$KEY" in
                branch) BRANCH="$VALUE" ;;
                name) NAME="$VALUE" ;;
                protocol) PROTOCOL="$VALUE" ;;
              esac
            done

            # Default values
            [ -z "$BRANCH" ] && BRANCH="master"
            [ -z "$NAME" ] && NAME=""

            echo "  Base URI: $BASE_URI"
            echo "  Branch: $BRANCH"
            echo "  Name: ${NAME:-<default>}"
            echo "  Protocol: ${PROTOCOL:-git}"

            # Determine SRCREV variable name
            if [ -n "$NAME" ]; then
              SRCREV_VAR="SRCREV_${NAME}"
            else
              SRCREV_VAR="SRCREV"
            fi

            # Extract current SRCREV
            CURRENT_REV=$(echo "$RECIPE_CONTENT" | \
              grep -E "^${SRCREV_VAR}\s*=" | \
              head -n1 | \
              sed 's/.*=\s*"//' | \
              sed 's/".*//' | \
              tr -d ' ')

            if [ -z "$CURRENT_REV" ]; then
              echo "  Warning: $SRCREV_VAR not found in recipe"
              continue
            fi

            # Skip AUTOREV
            if [ "$CURRENT_REV" = '${AUTOREV}' ] || [ "$CURRENT_REV" = 'AUTOREV' ]; then
              echo "  Skipping: AUTOREV is set"
              continue
            fi

            echo "  Current $SRCREV_VAR: $CURRENT_REV"

            # Convert git:// or gitsm:// to https:// for ls-remote
            HTTPS_URI=$(echo "$BASE_URI" | sed -E 's|^git(sm)?://|https://|')

            echo "  Remote URI: $HTTPS_URI"

            # Get latest revision
            if [ -n "$GIT_TOKEN" ]; then
              # Configure token for GitHub
              if echo "$HTTPS_URI" | grep -q "github.com"; then
                HTTPS_URI_AUTH="https://x-access-token:${GIT_TOKEN}@${HTTPS_URI#https://}"
                # Debug
                echo "  Token legth: ${#GIT_TOKEN}"
                echo "  Token prefix: ${GIT_TOKEN:0:4}... (truncated for security)"

                echo "  Remote URI with token: $HTTPS_URI_AUTH"
                HTTPS_URI="$HTTPS_URI_AUTH"
              fi
            else
              echo "  Token: not provided"
            fi

            # Fetch latest revision (capture stderr for debugging)
            # to get error code of git ls-remote
            set +e
            LS_REMOTE_OUTPUT=$(git ls-remote "$HTTPS_URI" "refs/heads/${BRANCH}" 2>&1)
            LS_REMOTE_EXIT=$?
            IS_ERROR_EXIT=false
            set -e

            if [ $LS_REMOTE_EXIT -ne 0 ]; then
              echo "  Error fetching latest revision: $LS_REMOTE_OUTPUT(exit code: $LS_REMOTE_EXIT)"
              exit 1
            fi

            LATEST_REV=$(echo "$LS_REMOTE_OUTPUT" | cut -f1)

            if [ -z "$LATEST_REV" ]; then
              echo "  Warning: Could not fetch latest revision for branch $BRANCH"
              continue
            fi

            echo "  Latest revision: $LATEST_REV"

            # Compare revisions
            if [ "$CURRENT_REV" = "$LATEST_REV" ]; then
              echo "  -> Already up to date"
              continue
            fi

            echo "  -> Update needed: $CURRENT_REV -> $LATEST_REV"

            # Update the recipe file
            sed -i "s|^\(${SRCREV_VAR}\s*=\s*\"\)[^\"]*\"|\1${LATEST_REV}\"|" "$RECIPE"

            UPDATED="true"
            if [ -z "$UPDATED_FILES" ]; then
              UPDATED_FILES="$RECIPE"
            else
              UPDATED_FILES="$UPDATED_FILES $RECIPE"
            fi

            # Build change entry for JSON
            DISPLAY_NAME="${NAME:-default}"
            CHANGE_ENTRY=$(cat <<EOF
        {
          "recipe": "$RECIPE",
          "name": "$DISPLAY_NAME",
          "uri": "$BASE_URI",
          "branch": "$BRANCH",
          "old_rev": "$CURRENT_REV",
          "new_rev": "$LATEST_REV"
        }
        EOF
            )

            # Append to JSON array
            if [ "$CHANGES_JSON" = "[]" ]; then
              CHANGES_JSON="[${CHANGE_ENTRY}]"
            else
              CHANGES_JSON="${CHANGES_JSON%]}, ${CHANGE_ENTRY}]"
            fi

            # Build commit body line
            COMMIT_BODY="${COMMIT_BODY}${RECIPE_NAME}: ${BRANCH}: ${CURRENT_REV:0:12} -> ${LATEST_REV:0:12}\n"

          done
        done

        # Commit if there are changes
        if [ "$UPDATED" = "true" ]; then
          git add -A
          COMMIT_MSG="chore: automatically update srcrev [skip ci]

        $(echo -e "$COMMIT_BODY")"
          git commit -m "$COMMIT_MSG"
          echo "Committed changes"
        fi

        # Output results
        echo "updated=$UPDATED" >> $GITHUB_OUTPUT

        # Output JSON
        {
          echo "changes<<EOF"
          echo "$CHANGES_JSON"
          echo "EOF"
        } >> $GITHUB_OUTPUT

        # Output summary (same as commit body)
        {
          echo "summary<<EOF"
          echo -e "$COMMIT_BODY"
          echo "EOF"
        } >> $GITHUB_OUTPUT

        echo ""
        echo "=========================================="
        echo "Summary"
        echo "=========================================="
        echo "Updated: $UPDATED"
        echo -e "Changes:\n$COMMIT_BODY"
