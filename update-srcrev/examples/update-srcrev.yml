# .github/workflows/update-srcrev.yml
# Automatically update SRCREV in Yocto recipe files

name: Update SRCREV

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update SRCREV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find recipe files with SRC_URI and SRCREV
        id: find
        run: |
          # Find .bb and .inc files containing both:
          # - SRC_URI with git:// or gitsm://
          # - SRCREV definition
          RECIPES=""

          while IFS= read -r file; do
            if grep -qE '^SRC_URI.*git(sm)?://' "$file" && \
               grep -qE '^SRCREV' "$file"; then
              RECIPES="${RECIPES}${file}"$'\n'
              echo "Found: $file"
            fi
          done < <(find . -type f \( -name '*.bb' -o -name '*.inc' \) 2>/dev/null)

          if [ -z "$RECIPES" ]; then
            echo "No recipe files found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            {
              echo 'recipes<<EOF'
              echo "$RECIPES"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Update SRCREV
        if: steps.find.outputs.found == 'true'
        id: update
        uses: yoriito/actions/update-srcrev@v0
        with:
          recipe-paths: ${{ steps.find.outputs.recipes }}

      - name: Push changes
        if: steps.update.outputs.updated == 'true'
        run: git push

      - name: Summary
        run: |
          if [ "${{ steps.find.outputs.found }}" != "true" ]; then
            echo "## ℹ️ No recipe files found" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.update.outputs.updated }}" == "true" ]; then
            echo "## ✅ SRCREV updated and pushed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.update.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All recipes are up to date" >> $GITHUB_STEP_SUMMARY
          fi
